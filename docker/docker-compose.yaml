# ShopPilot 全栈编排：app + Qdrant + Redis + React 前端
#
# 用法：
#   cd shoppilot
#   export LLM_BASE_URL=<网关地址> LLM_API_KEY=<密钥>   # 敏感配置走环境变量，不落盘
#   docker compose -f docker/docker-compose.yaml up -d --build
#   前端 http://localhost:5173，后端 http://localhost:8000
#
# 存储用 SQLite，落在 app-data 卷（零外部依赖，无需额外容器）。
# 注意：compose 形态下 QDRANT_URL 指向 qdrant 服务（覆盖本地嵌入模式）。
x-agent-options: &agent-options
  IDENTITY_MODE: ${IDENTITY_MODE:-demo}
  SESSION_OWNER_BINDING: ${SESSION_OWNER_BINDING:-1}
  IDENTITY_HMAC_SECRET: ${IDENTITY_HMAC_SECRET-}
  PROMPT_PIN_VERSION: ${PROMPT_PIN_VERSION-}
  METRICS_READER_BUYERS: ${METRICS_READER_BUYERS-}
  RERANKER_MODE: ${RERANKER_MODE:-http}
  RERANKER_API_KEY: ${RERANKER_API_KEY-}
  RERANKER_PROTOCOL: ${RERANKER_PROTOCOL:-flat}
  RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-15}
  HYBRID_LEXICAL_WEIGHT: ${HYBRID_LEXICAL_WEIGHT:-1}
  HYBRID_VECTOR_WEIGHT: ${HYBRID_VECTOR_WEIGHT:-1}
  RECALL_CANDIDATES: ${RECALL_CANDIDATES:-32}
  HYBRID_RECALL_ENABLED: ${HYBRID_RECALL_ENABLED:-0}
  CONTEXT_SIZE: ${CONTEXT_SIZE:-128000}
  CONTEXT_STRATEGY: ${CONTEXT_STRATEGY:-layered}
  CONTEXT_PRUNING_TIMING: ${CONTEXT_PRUNING_TIMING:-pressure}
  CONTEXT_PRODUCT_TOKENS: ${CONTEXT_PRODUCT_TOKENS:-6000}
  CONTEXT_TARGET_TOKENS: ${CONTEXT_TARGET_TOKENS:-48000}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  TOOL_RESULT_LIMIT: ${TOOL_RESULT_LIMIT:-20000}
  TOKEN_BUDGET_TOTAL: ${TOKEN_BUDGET_TOTAL:-0}
  REPLY_TOKEN_BUDGET: ${REPLY_TOKEN_BUDGET:-0}
  HARNESS_ENABLED: ${HARNESS_ENABLED:-1}
  OUTPUT_GUARD_ENABLED: ${OUTPUT_GUARD_ENABLED:-1}
  DRIFT_DETECT_ENABLED: ${DRIFT_DETECT_ENABLED:-0}
  LOOP_REPEAT_THRESHOLD: ${LOOP_REPEAT_THRESHOLD:-3}
  BREAKER_SHARED: ${BREAKER_SHARED:-0}
  PREFERENCE_RELEVANCE_ENABLED: ${PREFERENCE_RELEVANCE_ENABLED:-0}
  PREFERENCE_TOP_K: ${PREFERENCE_TOP_K:-5}
  PREFERENCE_SUBAGENT_INJECT: ${PREFERENCE_SUBAGENT_INJECT:-1}
  QUEUE_PRIORITY_ENABLED: ${QUEUE_PRIORITY_ENABLED:-1}
  QUEUE_LARGE_REQUEST_TURNS: ${QUEUE_LARGE_REQUEST_TURNS:-30}
  CATEGORY_KB_COLLECTION: ${CATEGORY_KB_COLLECTION:-shoppilot_category_kb}
  TAVILY_API_KEY: ${TAVILY_API_KEY-}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  # 模型目录与凭据配置由 API/worker 共享；空字符串保留 Settings 的可选语义。
  LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING-}
  LLM_FALLBACK_CONTEXT_SIZE: ${LLM_FALLBACK_CONTEXT_SIZE-}
  MODEL_ADMIN_BUYERS: ${MODEL_ADMIN_BUYERS-}
  MODEL_ALLOWED_LOCAL_HOSTS: ${MODEL_ALLOWED_LOCAL_HOSTS-}
  MODEL_MASTER_KEY: ${MODEL_MASTER_KEY-}
  MODEL_RECOVERY_MODE: ${MODEL_RECOVERY_MODE:-off}
  # 本机 .env 可由 compose --env-file .env 读取；API 与 worker 共享同一追踪项目。
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY-}

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *agent-options
      # 敏感配置透传宿主机环境变量，缺失时直接报错，避免明文落盘
      LLM_BASE_URL: ${LLM_BASE_URL:?需设置 LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:?需设置 LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen3-max}
      # 四期：网关配额闸门与限流回退（不配则用 settings 默认值）
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL-qwen-plus}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_MIN_INTERVAL_SECONDS: ${LLM_MIN_INTERVAL_SECONDS:-1.0}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL-}
      RERANKER_MODEL: ${RERANKER_MODEL-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-shoppilot_products}
      # 四期：存储走 SQLite（落在 app-data 卷）；DATABASE_URL=file 退回 JSON 文件存储
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/shoppilot.db}
      # 四期：Redis 缓存（embedding 缓存 + 语义缓存 + 幂等键）；置空则全部缓存关闭
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      # 跑评测回归时设为 0：开着缓存会把旧回复直接返回，评分变成评缓存
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-1}
      # 四期：队列削峰（需 worker 服务一起跑）；QUEUE_ENABLED=0 则意图在 API 进程内直跑
      QUEUE_ENABLED: ${QUEUE_ENABLED:-1}
      QUEUE_WAIT_SECONDS: ${QUEUE_WAIT_SECONDS:-300}
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:5173
      # 可选 OTLP/HTTP；Langfuse 的通用端点以 /api/public/otel 结尾。
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS-}
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-5}
      OTEL_SERVICE_NAME: shoppilot-api
    volumes:
      - app-data:/app/data
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 意图消费进程：同镜像不同命令。削峰的实质是 WORKER_CONCURRENCY 限住同时在跑的轮数。
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *agent-options
      LLM_BASE_URL: ${LLM_BASE_URL:?需设置 LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:?需设置 LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen3-max}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL-qwen-plus}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_MIN_INTERVAL_SECONDS: ${LLM_MIN_INTERVAL_SECONDS:-1.0}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL-}
      RERANKER_MODEL: ${RERANKER_MODEL-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-shoppilot_products}
      # 与 app 共一个 SQLite 文件（共享 app-data 卷）；WAL 已开，缓解双进程写锁竞争
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/shoppilot.db}
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      QUEUE_ENABLED: "1"
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS-}
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-5}
      OTEL_SERVICE_NAME: shoppilot-worker
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 接收队列任务后同步持久化日志；共享配额/缓存也使用该实例，吞吐需按实际负载验收。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  app-data:
  qdrant-data:
  redis-data:
